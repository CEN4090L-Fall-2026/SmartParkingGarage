services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: smart_parking
      POSTGRES_USER: smart_parking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_parking -d smart_parking"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
