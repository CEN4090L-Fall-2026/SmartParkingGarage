[project]
name = "smart-parking-garage-backend"
version = "0.1.0"
description = "FastAPI backend for the Smart Parking Garage"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29,<1.0",
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]
[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
